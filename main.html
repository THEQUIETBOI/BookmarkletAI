<!DOCTYPE html>
<html>

<head>
  <title>Custom Element Structure</title>
  <style>
    /*  These styles should be in the shadow DOM's stylesheet.
        The styles below are for demonstration purposes.  */
    :host {
      background-color: #3d425c;
      position: fixed;
      right: 0;
      bottom: 0;
      width: 300px;
      min-width: 300px;
      max-width: 1000px;
      height: 410px;
      min-height: 200px;
      border: 1px solid #ccc;
      border-radius: 5%;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      resize: both;
    }

    .buttons-container {
      background-color: rgb(78, 78, 78);
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      padding: 5px;
      box-sizing: border-box;
    }

    .chat-container {
      background-color: #3d425c;
      height: calc(100% - 120px);
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 25px;
    }

    .botMessage,
    .userMessage {
      color: rgb(255, 255, 255);
      font-weight: 600;
      background-color: rgb(32, 32, 32);
      border-radius: 10px;
      overflow-wrap: break-word;
      margin-top: 10px;
      padding: 10px;
    }

    .botMessage {
      font-family: 13px "monospace";
    }


    .me-container {
      height: 20px;
      background-color: #3d425c;
      box-sizing: border-box;
      padding: 5px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .menu-container-buttons {
      background-color: gray;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 5px;
      border-radius: 50px;
      border: 4px solid tan;
    }

    .me-container input[type="text"] {
      height: 100%;
      outline: none;
      padding: 5px;
      border: 1px solid tan;
      background-color: #242424;
      color: rgb(255, 255, 255);
      border-radius: 10px;
    }


    .settings {
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      display: flex;
      width: 40px;
      border: none;
      background-color: transparent;
      cursor: pointer;
    }

    .settings:hover {
      background-color: #ccc;
    }

    .settings-page {
      position: absolute;
      background-color: rgb(46, 46, 46);
      width: 100%;
      height: 60%;
      visibility: hidden;
    }

    .settings-content {
      color: white;
      font-size: 25px;
      padding-top: 50px;
      padding-left: 20px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 60px;
    }

    .custom-file-upload {
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      display: flex;
      align-items: center;
      margin-top: 10px;
      width: 30px;
      height: 30px;
      border: none;
      background-color: transparent;
    }

    .custom-file-upload:hover {
      background-color: #ddd;
    }

    .custom-file-upload input[type="file"] {
      display: none;
    }

    p code {
      background-color: rgb(78, 78, 78);
      display: inline-block;
      color: rgb(228, 228, 228);
      padding: 10px;
      font-family: 'Times New Roman', Times, serif;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

gemini.text = "GEMINI 2.5"

      settingsButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000" height="40px" width="40px" version="1.1" id="Capa_1" viewBox="0 0 489.802 489.802" xml:space="preserve">

    </g>
    </svg>`;
      menuContainerButtons.appendChild(settingsButton);

      const ChatInput = document.createElement('input');
      ChatInput.type = "text";
      ChatInput.className = "chat-input";
      ChatInput.placeholder = "Type here...";
      menuContainerButtons.appendChild(ChatInput);

      const stylesheet = document.createElement('style');
      shadowRoot.appendChild(stylesheet); // Append to shadowRoot

      const marcopolo = document.createElement("script");
      marcopolo.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
      document.head.appendChild(marcopolo);

      settingsButton.onclick = () => {
        settingsPage.style.visibility = "visible";
      }

      close.onclick = () => {
        settingsPage.style.visibility = "hidden";
      }

      stylesheet.innerHTML = `
        :host {
          background-color: #3d425c;

          bottom: 0;
          width: 300px;

        }

        .me-container {

          box-sizing: border-box;
          padding: 5px;

        }

        .menu-container-buttons {
          background-color: gray;

        }

        .me-container input[type="text"] {
          height: 100%;
          outline: none;

        }

          background-position: center;

          display: flex;
          width: 40px;

        }

          position: absolute;

        }

        .settings-content {

      `;

      function makeDraggable(element, handle) {
        let isDragging = false;
        let offsetX, offsetY;

        function handlePointerDown(e) {
          e.preventDefault();
          isDragging = true;

          const isTouch = e.type === "touchstart";
          const event = isTouch ? (e.touches[0] || e) : e;

          offsetX = event.clientX - element.offsetLeft;
          offsetY = event.clientY - element.offsetTop;

          document.addEventListener("mousemove", handlePointerMove);
          document.addEventListener("touchmove", handlePointerMove);
          document.addEventListener("mouseup", handlePointerUp);
          document.addEventListener("touchend", handlePointerUp);
          document.addEventListener("mouseleave", handlePointerUp);
        }

        function handlePointerMove(e) {
          if (!isDragging) return;

          const isTouch = e.type === "touchmove";
          const event = isTouch ? e.touches[0] : e;

          const x = event.clientX - offsetX;
          const y = event.clientY - offsetY;

          element.style.left = `${x}px`;
          element.style.top = `${y}px`;
        }

        function handlePointerUp() {
          isDragging = false;
          document.removeEventListener("mousemove", handlePointerMove);
          document.removeEventListener("touchmove", handlePointerMove);
          document.removeEventListener("mouseup", handlePointerUp);
          document.removeEventListener("touchend", handlePointerUp);
          document.removeEventListener("mouseleave", handlePointerUp);
        }

        handle.addEventListener("mousedown", handlePointerDown);
        handle.addEventListener("touchstart", handlePointerDown);

        element.style.position = 'fixed';
        element.style.cursor = 'grab';
        handle.style.cursor = 'grab';
      }

      const buttonContainers = shadowRoot.querySelector(".buttons-container");
      if (mainContainer && buttonContainers) {
        makeDraggable(mainContainer, buttonContainers);
      }


      const hide = document.getElementById("main-container");
      const ChatInputs = shadowRoot.querySelector('.chat-input');
      document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "]") {
          if (document.activeElement !== ChatInputs) {
            mainContainer.classList.toggle("hidden");
          }
        }
      });

      ChatInputs.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          const userInput = ChatInputs.value.trim();

          if (userInput !== "") {
            ChatInputs.value = "";

            const userMessage = document.createElement("p");
            userMessage.className = "userMessage";
            userMessage.textContent = "You: " + userInput;
            chatContainer.appendChild(userMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const botMessage = document.createElement("p");
            botMessage.className = "botMessage";
            botMessage.textContent = "Bot: Thinking...";
            chatContainer.appendChild(botMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const apiKeyFromStorage = localStorage.getItem("what");
            if (!apiKeyFromStorage) {
                botMessage.textContent = "Please set your API key first!";
                return;
            }

            try {
              const apiKey = localStorage.getItem("what");
              const PromptValue = Prompt.value
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    system_instruction: {
                      parts: [{
                        text: PromptValue
                      }]
                    },
                    contents: [{
                      parts: [{
                        text: userInput
                      }]
                    }]
                  })
                }
              );

              if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
              }

              const data = await response.json();
              chatContainer.removeChild(botMessage);

              if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                const botResponse = data.candidates[0].content.parts[0].text.toString().trim();
                const parsedResponse = marked.parse(botResponse);

                const botMessageElement = document.createElement('p');
                botMessageElement.className = "botMessage";
                botMessageElement.innerHTML = "Bot: " + parsedResponse; //Use the string as HTML

                chatContainer.appendChild(botMessageElement);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } else {
                const errorMessageElement = document.createElement('p');
                errorMessageElement.className = "botMessage error";
                errorMessageElement.textContent = "Error: Could not get a valid response from the API.";
                chatContainer.appendChild(errorMessageElement);
              }

            } catch (error) {
              console.error("API request failed:", error);
              const errorMessageElement = document.createElement('p');
              errorMessageElement.className = "botMessage error";
              errorMessageElement.textContent = "Error: " + error.message; // Display the actual error message
              chatContainer.appendChild(errorMessageElement);

            } finally {
              ChatInputs.value = ""; // Clear input
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
        }
      });

      apiKey.addEventListener("change", () => {
        localStorage.setItem("what", apiKey.value);
        alert("API Key updated!");

      });

      Prompt.addEventListener("change", () => {
        alert("Prompt updated!");
      });
    }
